[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "densimap"
version = "0.1.0"
description = "Density map of business categories in the Guadalajara Metropolitan Area from INEGI DENUE"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.14"
dependencies = [
    "PyYAML>=6.0,<7.0",
    "atlas-geo @ https://github.com/DatzinDev/Atlas/archive/63a12a3a9b9de6bbfe75777bcdabe0ef0418a2c8.tar.gz",
    "uvicorn>=0.34,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "ruff>=0.9,<1.0", "httpx2>=2.0,<3.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "app", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
